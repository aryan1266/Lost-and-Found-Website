
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Report Lost Item</title>
</head>

<body>

    <h1>Report a Lost Item</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="lost.html">Lost Item</a> |
        <a href="found.html">Found Item</a>
    </nav>

    <hr>

    <p>
        Please fill in the details of the item you lost.
    </p>

    <form>

        <label for="name">Item Name:</label><br>
        <input type="text" id="name" required>

        <br><br>

        <label for="category">Item Category:</label><br>

        <select id="category" required>
            <option value="">Select Category</option>
            <option>Electronics</option>
            <option>ID Card</option>
            <option>Books</option>
            <option>Accessories</option>
            <option>Other</option>
        </select>

        <br><br>

        <label for="description">Description:</label><br>

        <textarea id="description" rows="4" cols="35"
        placeholder="Describe your lost item"
        required></textarea>

        <br><br>

        <label for="date">Date Lost:</label><br>
        <input type="date" id="date" required>

        <br><br>

        <label for="location">Last Seen Location:</label><br>
        <input type="text" id="location" required>

        <br><br>

        <label for="photo">Upload Item Photo:</label><br>
        <input type="file" id="photo" accept="image/*">

        <br><br>

        <label for="email">Your Email:</label><br>
        <input type="email" id="email" required>

        <br><br>

        <button type="submit">Submit Report</button>
        <button type="reset">Clear Form</button>

    </form>

    <hr>

    <p><a href="index.html">Back to Home</a></p>

</body>
</html>
